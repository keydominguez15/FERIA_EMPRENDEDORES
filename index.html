<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Feria de Emprendedores</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .oculto {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- PANEL IZQUIERDO -->
        <div class="welcome-section" id="panel-izquierdo">
            <div class="top-link"><a href="catalogo.html">&lt; Catálogo Público</a></div>
            
            <div class="welcome-content">
                <div class="logo">💜 Q17T</div>
                <h1 id="welcome-title">¡Hola de nuevo!</h1>
                <div class="divider"></div>
                <p id="welcome-text">Para mantenerte conectado con tus emprendimientos e inscripciones, por favor inicia sesión.</p>
                <p id="welcome-subtext">¿No tienes una cuenta todavía?</p>
                <button class="btn-outline" id="btn-toggle" onclick="alternarVista()">Sign Up</button>
            </div>
        </div>

        <!-- PANEL DERECHO -->
        <div class="form-card">
            
            <!-- FORMULARIO DE INICIO DE SESIÓN -->
            <div id="seccion-login">
                <div class="help-text">¿Necesitas ayuda?</div>
                <h2>Log in</h2>
                
                <form id="formLogin">
                    <label for="correo-log">Email</label>
                    <input type="email" id="correo-log" placeholder="tucorreo@ejemplo.com" required>

                    <label for="password-log">Password</label>
                    <input type="password" id="password-log" placeholder="••••••••" required>

                    <div class="forgot-pass">¿Olvidaste tu contraseña?</div>

                    <button type="submit" class="btn-submit">Log in</button>
                </form>
                <p id="mensaje-log"></p>
            </div>

            <!-- FORMULARIO DE REGISTRO CON CONTRASEÑA Y ROL -->
            <div id="seccion-registro" style="display: none;">
                <div class="help-text">¿Necesitas ayuda?</div>
                <h2>Sign Up</h2>
                
                <form id="formRegistro">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>

                    <label for="correo-reg">Email</label>
                    <input type="email" id="correo-reg" placeholder="tucorreo@ejemplo.com" required>

                    <label for="password-reg">Contraseña</label>
                    <input type="password" id="password-reg" placeholder="Crea una contraseña" required>

                    <label for="rol">Tipo de Usuario</label>
                    <select id="rol" required>
                        <option value="expositor">Expositor</option>
                        <option value="administrador">Administrador</option>
                    </select>

                    <!-- CONTENEDOR ENVUELTO PARA OCULTAR EN MODO ADMIN -->
                    <div id="seccion-emprendimiento">
                        <label for="nombre_emprendimiento">Emprendimiento</label>
                        <input type="text" id="nombre_emprendimiento" placeholder="Nombre de tu negocio" required>

                        <label for="categoria">Categoría</label>
                        <select id="categoria" required>
                            <option value="">Selecciona una categoría</option>
                            <option value="Artesania">Artesanía</option>
                            <option value="Gastronomia">Gastronomía</option>
                            <option value="Tecnologia">Tecnología</option>
                            <option value="Moda">Moda</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Sign Up</button>
                </form>
                <p id="mensaje-reg"></p>
            </div>

        </div>
    </div>

<script>
    let esLogin = true;

    function alternarVista() {
        const secLogin = document.getElementById('seccion-login');
        const secRegistro = document.getElementById('seccion-registro');
        const title = document.getElementById('welcome-title');
        const text = document.getElementById('welcome-text');
        const subtext = document.getElementById('welcome-subtext');
        const btnToggle = document.getElementById('btn-toggle');

        esLogin = !esLogin;

        if (!esLogin) {
            secLogin.style.display = 'none';
            secRegistro.style.display = 'block';
            
            title.textContent = '¡Bienvenido!';
            text.textContent = 'Inscribe tu emprendimiento, comparte tu talento y asegura tu espacio en la feria.';
            subtext.textContent = '¿Ya tienes una cuenta?';
            btnToggle.textContent = 'Log in';
        } else {
            secRegistro.style.display = 'none';
            secLogin.style.display = 'block';
            
            title.textContent = '¡Hola de nuevo!';
            text.textContent = 'Para mantenerte conectado con tus emprendimientos e inscripciones, por favor inicia sesión.';
            subtext.textContent = '¿No tienes una cuenta todavía?';
            btnToggle.textContent = 'Sign Up';
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const selectRol = document.getElementById('rol');
        const camposEmprendimiento = document.getElementById('seccion-emprendimiento');
        const inputEmp = document.getElementById('nombre_emprendimiento');
        const selectCat = document.getElementById('categoria');

        // Control dinámico del rol (Ocultar/Mostrar campos de negocio)
        if (selectRol && camposEmprendimiento) {
            selectRol.addEventListener('change', function() {
                if (this.value === 'administrador') {
                    camposEmprendimiento.classList.add('oculto');
                    inputEmp.required = false;
                    selectCat.required = false;
                } else {
                    camposEmprendimiento.classList.remove('oculto');
                    inputEmp.required = true;
                    selectCat.required = true;
                }
            });
        }

        // Lógica del Formulario de Registro
        const formRegistro = document.getElementById('formRegistro');
        const mensajeReg = document.getElementById('mensaje-reg');

        formRegistro.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const rolSeleccionado = document.getElementById('rol').value;

            const datos = {
                nombre: document.getElementById('nombre').value.trim(),
                correo: document.getElementById('correo-reg').value.trim(),
                password: document.getElementById('password-reg').value,
                rol: rolSeleccionado,
                nombre_emprendimiento: rolSeleccionado === 'administrador' ? '' : inputEmp.value.trim(),
                categoria: rolSeleccionado === 'administrador' ? '' : selectCat.value
            };

            
            try {
                const respuesta = await fetch(
                    'http://localhost:3000/feria/registrar',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(datos)
                    }
                );

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    mensajeReg.style.color = '#48bb78';
                    mensajeReg.textContent = resultado.mensaje;
                    formRegistro.reset();
                    camposEmprendimiento.classList.remove('oculto');
                } else {
                    mensajeReg.style.color = '#fc8181';
                    mensajeReg.textContent =
                        resultado.mensaje || 'No se pudo completar el registro.';
                }
            } catch (error) {
                console.error('Error durante el registro:', error);
                mensajeReg.style.color = '#fc8181';
                mensajeReg.textContent =
                    'No se pudo conectar con el servidor. Revisa la consola.';
            }
});

        // Lógica del Formulario de Login (Conectado al Backend)
        const formLogin = document.getElementById('formLogin');
        const mensajeLog = document.getElementById('mensaje-log');

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();

            const credenciales = {
                correo: document.getElementById('correo-log').value.trim(),
                password: document.getElementById('password-log').value
            };

            try {
                const respuesta = await fetch('http://localhost:3000/feria/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credenciales)
                });

                const resultado = await respuesta.json();

                if (respuesta.ok) {
                    mensajeLog.style.color = '#48bb78';
                    mensajeLog.textContent = resultado.mensaje;

                    localStorage.setItem('correoUsuario', credenciales.correo);
                    localStorage.setItem('access_token', resultado.access_token);
                    localStorage.setItem('refresh_token', resultado.refresh_token);
                    localStorage.setItem('id_usuario', resultado.id_usuario);

                    // Redirección automática corregida basada en el rol
                    setTimeout(() => {
                        if (resultado.rol === 'administrador') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'expositor.html'; // Redirige correctamente al panel del expositor
                        }
                    }, 1000);
                } else {
                    mensajeLog.style.color = '#fc8181';
                    mensajeLog.textContent = resultado.mensaje;
                }
            } catch (error) {
                mensajeLog.style.color = '#fc8181';
                mensajeLog.textContent = 'No se pudo conectar con el servidor.';
            }
        });
    });
</script>
</body>
</html>
